{% extends "base.html" %}

{% block title %}Check your email — Scopequote{% endblock %}
{% block body_class %}account-page{% endblock %}

{% block content %}
  <section class="empty-state measure" aria-labelledby="reset-done-title">
    <h1 id="reset-done-title">Check your email</h1>
    <p>If an active account matches that address, a password-reset link is on its way.</p>
    <a class="button button--primary" href="{% url 'accounts:login' %}">Return to sign in</a>
  </section>
{% endblock %}
