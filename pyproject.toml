[project]
name = "scopequote"
version = "0.1.0"
description = "A calm, explainable project estimator for independent freelancers."
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6.0",
    "psycopg[binary]>=3.2,<4.0",
    "Pillow>=11.0,<12.0",
    "WeasyPrint>=66.0,<67.0",
    "WhiteNoise>=6.9,<7.0",
    "gunicorn>=23.0,<24.0",
    "cryptography>=44.0,<46.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11,<1.0",
    "pip-tools>=7.4,<8.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
